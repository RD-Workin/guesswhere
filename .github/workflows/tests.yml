name: Tests

# Sur chaque PR : les mêmes vérifications que la publication, pour qu'aucune
# version qui fuit ne puisse être fusionnée sans le voir.
on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Vérification des types : test:e2e compile avec vite, qui ne la fait pas.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
