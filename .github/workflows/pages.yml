name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Tests de bout en bout avant toute publication : zéro requête vers un
      # tiers, aucune métadonnée dans les images stockées, hors ligne, satellite.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      # Vue satellite mondiale (NASA Blue Marble, domaine public), la même pour
      # tout le monde. Les tuiles d'origine sont gardées en cache d'Actions pour
      # ne pas les retélécharger à chaque publication. En cas d'échec, le site
      # est publié sans elle : l'app garde sa carte dessinée.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .satellite-cache
          key: satellite-bluemarble-v1
      - name: Vue satellite
        continue-on-error: true
        run: |
          go install github.com/protomaps/go-pmtiles@v1.31.2
          ln -sf "$(go env GOPATH)/bin/go-pmtiles" "$(go env GOPATH)/bin/pmtiles"
          export PATH="$(go env GOPATH)/bin:$PATH"
          pip install --quiet pillow==12.3.0
          python3 scripts/satellite.py .satellite-cache dist/carte 7 \
            || python3 scripts/satellite.py .satellite-cache dist/carte 6 \
            || python3 scripts/satellite.py .satellite-cache dist/carte 5
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
